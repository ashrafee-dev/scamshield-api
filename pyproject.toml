[project]
name = "scamshield-api"
version = "0.1.0"
description = "An API to detect scams in phone calls, emails and messages."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "ffmpeg>=1.4",
    "ffmpeg-python>=0.2.0",
    "filetype>=1.2.0",
    "openai>=2.45.0",
    "openai-whisper>=20250625",
    "redis>=8.0.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
     "fakeredis>=2.38.0",
     "pylint>=4.0.6",
     "pytest>=9.1.1",
     "pytest-asyncio>=1.4.0",
     "pytest-mock>=3.15.1",
]
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "redefined-outer-name",
]
