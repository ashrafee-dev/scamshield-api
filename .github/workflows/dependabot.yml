name: Dependabot PR Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Metadata from Dependabot PRs
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
